name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

# Preserve CI evidence for every direct-to-main commit by never cancelling main runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Inverted on purpose: any path not listed as non-code runs the full suite.
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          code=true
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] && [ -n "$BASE" ] && [ "$BASE" != 0000000000000000000000000000000000000000 ] \
            && changed=$(git diff --name-only "$BASE" HEAD) \
            && ! grep -qvE '^(docs/|mkdocs\.yml$|Dockerfile\.docs$|\.github/workflows/docs\.yml$|renovate\.json$|LICENSE$)|\.md$' <<<"$changed"; then
            code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  release-config:
    name: Release Configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate GoReleaser configuration
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: '~> v2'
          args: check

  vet:
    name: Go Vet
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest

  script-tests:
    name: Script Tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Shell regression tests
        run: make test-scripts

  unit-tests:
    name: Unit Tests (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            packages: ./internal/app/...
          - name: cli
            packages: ./internal/cli/...
          - name: tui
            packages: ./internal/tui/...
          - name: remaining
            packages: remaining
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install GNU Stow (required for dots integration coverage)
        if: matrix.name != 'remaining'
        run: |
          sudo apt-get update
          sudo apt-get install -y stow

      - name: Race tests
        shell: bash
        run: |
          set -o pipefail
          packages='${{ matrix.packages }}'
          if [ "$packages" = remaining ]; then
            packages=$(go list ./... | grep -Ev '/internal/(app|cli|tui)(/|$)' | tr '\n' ' ')
          fi
          evidence_dir="$RUNNER_TEMP/omni-test-evidence/unit-${{ matrix.name }}"
          mkdir -p "$evidence_dir"
          cat >"$evidence_dir/meta.json" <<'JSON'
          {"schema_version":1,"lane":"unit-${{ matrix.name }}","goos":"linux","tags":[],"count":1}
          JSON
          make --silent test-unit TEST_PACKAGES="$packages" TEST_FLAGS="-race -trimpath -count=1 -json" \
            | tee "$evidence_dir/go-test.jsonl"

      - name: Upload flow evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: flow-evidence-unit-${{ matrix.name }}
          path: ${{ runner.temp }}/omni-test-evidence/unit-${{ matrix.name }}
          if-no-files-found: error

  apm-platform-contracts:
    name: APM Platform Contracts (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      OMNI_TEST_APPROVED_TOOLS: apm
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'

      # Reads the pin from the source of truth; a second copy here silently tested the old build.
      - name: Install the pinned APM release
        shell: bash
        run: |
          apm_package=$(sed -n 's/^const apmPackagePin = "\([^"]*\)"$/\1/p' internal/app/apm_version.go)
          [ -n "$apm_package" ] || { echo "failed to read apmPackagePin from internal/app/apm_version.go" >&2; exit 1; }
          python -m pip install "$apm_package"
          python -c 'import os, sysconfig; print(sysconfig.get_path("scripts"), file=open(os.environ["GITHUB_PATH"], "a"))'

      - name: Test portable APM target contracts
        run: go test ./internal/app -run '^TestAPM(Target|User)'

      - name: Test onboarding protocol and private-state contracts
        run: go test ./internal/config ./internal/apm ./internal/app -run 'Onboard|ImportSchema|DefaultStateDir|RootPrivate|RootRejects|VerifyDetects|CommitLegacyFragments|DescriptorRelative|WriteConfigLocks|InitDetects'

      - name: Test real stable-target MCP lifecycle
        run: go test -tags=integration ./internal/apm -run '^TestGlobalMCPLifecycleForEveryStableTarget$' -count=1

      # All skip off darwin; this is the only lane that runs them, and the path they guard writes.
      - name: Test Darwin legacy agents template handling
        run: go test ./internal/app -run '^(TestAgentsAdoptReportsLegacyDarwinTemplateWithoutAdoptingIt|TestAgentsTemplatePathAdoptsLegacyDarwinTemplate|TestAgentsTemplatePathLeavesSymlinkedCanonicalAlone)$' -count=1

  onboarding-unit:
    name: Onboarding Unit (race)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test onboarding coordinator, protocol, security, and CLI
        run: go test -race -count=1 ./internal/config ./internal/executor ./internal/apm ./internal/app ./internal/cli ./internal/tui -run 'Onboard|Legacy|CommitLegacyFragments|ImportSchema|DefaultStateDir|ActionCatalog|RootPrivate|RootRejects|APMCommand|DescriptorRelative|WriteConfigLocks|InitDetects'

  integration:
    name: Docker Integration Tests (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cli-ad
            packages: -parallel=8 -run=^TestCLI$$/^[ad] ./integration_tests/...
            cache: integration-cli-ad
          - name: cli-rest
            packages: -parallel=8 -run=^TestCLI$$/^[^ad] ./integration_tests/...
            cache: integration-tests
          - name: non-cli
            packages: -parallel=1 -skip=^(TestCLI$$|TestCLIBinary|TestCLIAndTUI|TestTUI) ./integration_tests/...
            cache: integration-non-cli
          - name: providers
            packages: ./internal/provider/...
            cache: provider-tests
          - name: apm
            packages: ./internal/apm/... ./internal/cli/...
            cache: integration-apm
          - name: onboarding
            packages: -parallel=1 -run=^(TestAgentsMigrationRealAPMLifecycle|TestAgentsManifestlessRealAPMLifecycle|TestTUIAgentsTabSyncsMCPThroughRealAPM)$$ ./internal/app/... ./integration_tests/...
            cache: integration-onboarding
          - name: realism-cli
            packages: -parallel=1 -timeout=10m -run=^TestCLIBinary.*$$ ./integration_tests/...
            cache: integration-realism-cli
          - name: realism-tui
            packages: -parallel=1 -timeout=10m -run=^(TestCLIAndTUI.*|TestTUI.*)$$ ./integration_tests/...
            cache: integration-realism-tui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # container driver: type=gha export fails on the default docker driver
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # exposes the GHA runtime env that type=gha cache needs outside build-push-action
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      # One frozen entry for all lanes: the cache budget is full and std plus deps dominate the compile.
      - name: Restore integration Go build cache
        id: go-build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tmp/integration-go-build
          key: integration-go-build-v2-${{ hashFiles('go.sum', 'Dockerfile.test') }}

      - name: Integration tests in Docker
        run: make test-integration
        env:
          INTEGRATION_PACKAGES: ${{ matrix.packages }}
          INTEGRATION_LANE: ${{ matrix.name }}
          INTEGRATION_GOCACHE: '1'
          DOCKER_TEST_CACHE: >-
            --cache-from type=gha,scope=integration-cli-ad
            --cache-from type=gha,scope=integration-tests
            --cache-from type=gha,scope=integration-non-cli
            --cache-from type=gha,scope=provider-tests
            --cache-from type=gha,scope=integration-apm
            --cache-from type=gha,scope=integration-onboarding
            --cache-from type=gha,scope=integration-realism-cli
            --cache-from type=gha,scope=integration-realism-tui
            --cache-to type=gha,scope=${{ matrix.cache }},mode=max

      # Only the apm lane saves: it compiles internal/cli and so nearly the whole module.
      - name: Save integration Go build cache
        if: always() && matrix.name == 'apm' && steps.go-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tmp/integration-go-build
          key: ${{ steps.go-build-cache.outputs.cache-primary-key }}

      - name: Upload integration test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: flow-evidence-docker-${{ matrix.name }}
          path: .tmp/test-evidence/docker-${{ matrix.name }}
          if-no-files-found: error

  flow-evidence:
    name: Flow Evidence
    if: always() && needs.unit-tests.result != 'skipped'
    needs: [unit-tests, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download flow evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: flow-evidence-*
          path: ${{ runner.temp }}/downloaded-evidence

      - name: Verify declared flow evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/combined-evidence"
          mkdir "$evidence"
          for artifact in "$RUNNER_TEMP"/downloaded-evidence/flow-evidence-*; do
            test -d "$artifact"
            lane="${artifact##*/flow-evidence-}"
            mv "$artifact" "$evidence/$lane"
          done
          go run ./scripts/flow-evidence -catalog test/flows.json -evidence "$evidence"
