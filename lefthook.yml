# CI runs the integration suite only after a push has already landed, and history
# here is linear and direct-to-main, so this is the last gate that still sees the
# exact tree being published. Feature branches stay fast; only main pays for it.
pre-push:
  commands:
    integration:
      only:
        - ref: main
      glob:
        - "cmd/**"
        - "internal/**"
        - "integration_tests/**"
        - "scripts/**"
        - go.mod
        - go.sum
        - .dockerignore
        - Dockerfile.test
        - Makefile
      run: make test-integration

pre-commit:
  commands:
    lint:
      run: make lint
    gen-schema:
      glob: "{internal/config/config.go,internal/config/loader.go,scripts/gen-schema/**}"
      run: go run ./scripts/gen-schema && git add spec/omni.settings.v*.schema.json spec/omni.settings.schema.json

post-commit:
  commands:
    refresh-local-omni:
      run: scripts/refresh-local-omni.sh

post-merge:
  commands:
    refresh-local-omni:
      run: scripts/refresh-local-omni.sh

post-rewrite:
  commands:
    refresh-local-omni:
      run: scripts/refresh-local-omni.sh

post-checkout:
  commands:
    refresh-local-omni:
      run: scripts/refresh-local-omni.sh {1} {2} {3}

# Git moves a tag without touching a branch, and lefthook skips pre-push when a push carries no files.
reference-transaction:
  commands:
    refresh-local-omni:
      use_stdin: true
      run: scripts/refresh-local-omni.sh {1}
